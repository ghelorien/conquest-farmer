# Toxic's second field, rotated with giantape-north at each restock (a field
# gives ~1.5-2.4M xp/h fresh and thins to ~0.7-1.1M within 15-30 min). Suicide
# alternates giantape-west and giantape-south from 21:29 (2026-09-29). Its scan
# of the south box at 21:27-21:30 found 0 of 40 visible GiantApes inside it,
# 20 of them just south at (573-609, 368-379), which nobody hunts.
# The box starts 6 rows below giantape-south (y <= 350), so the two never meet
# after both expand 1 tile, and x >= 587 keeps it 17+ tiles from the south
# Kings' 17:44 spots (569-571, 360-367). Like giantape-south, its geometry is
# clean for travel_path: from town the approach passes 33+ tiles from every
# King, as do replans from 4 tiles either side of that road, and no tile of the
# box plans a town walk within 15 tiles of one.
hunting_boundary: [587, 356, 622, 386]
