notes: Half of the WingedSnake herd split east/west for two farmers (2026-09-29). Toxic's 85-minute survey
  (22:02-23:27, 5,319 cell sightings) put the snakes at x310-395, y70-126 (110-137 unique per 10x10 cell);
  48% stood outside the old wingedsnake boundary (282,42-352,112), whose north third and west strip held
  none, so its patrol kept both farmers on empty ground. The west half holds the WingedSnakeKing (box
  317-348 x 97-114).
