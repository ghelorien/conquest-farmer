elite_clearance: 13
# Toxic's second field, rotated with giantape-north at each restock (a field
# gives ~1.5-2.4M xp/h fresh and thins to ~0.7-1.1M within 15-30 min; the
# rested north gave 2.39M at 20:14-20:24, 2026-09-29). Suicide moved from
# giantape-west to giantape-south at 20:34, which left this strip unused.
# It is giantape-west without two parts:
# - y 285-294: from its north-west corner (563, 286) travel_path detours
#   round the rocks at (561-573, 289-293) via (546, 306), 2 tiles from
#   GiantApeKing 404774 (541-547, 302-310). Every return from y >= 295 walks
#   straight to the anchor, 16+ tiles from every King. The gap also keeps it
#   10 rows from giantape-north (y <= 284) while that field rests.
# - x 562-565: returns from that edge go round the rock at (561-565,
#   314-315), 10-13 tiles from King 404774.
# - y 341-344: the corner (564-574, 343) where packs from the dense ground
#   south-west (x 540-570, y 340-360) swarmed Suicide at 20:24 and 20:29.
# x <= 584 keeps it apart from giantape-south (x >= 587, Suicide) after both
# expand 1 tile. The anchor and road are giantape-west's: from town the approach passes
# 24+ tiles from every King (south of the middle King, then west).
hunting_boundary: [566, 295, 584, 340]
