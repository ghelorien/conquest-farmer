# Unhunted GiantApe ground west of King 404774. Suicide walked through it at
# 22:06 (2026-09-29) with 32-41 GiantApes, 7-12 GiantApeL53 and 1-2
# GiantApeMsgr in view at once; by 22:22 the plain Toxic had hunted all
# evening held 6 monsters within 45 tiles of it. Bosses Suicide saw there:
# GiantApeKings at (478, 277) and (462, 349), GiantApeAides at (473, 280) and
# (527, 335); King 404774 idles at (541-547, 302-310). The box keeps 14+ tiles
# from each (bosses move: the trial's live boss checks and boss_zone travel
# are what protect). It stays north of Suicide's road between thunderape-nw
# and town, which crosses y 326-359 at x 450-510.
# The planned road from town crosses the plain beside King 404774's idle spot;
# patrol_step walks round him once he is in view: stepped over the real map
# with bosses seen from 30 tiles, the walk keeps 16+ tiles from every King and
# 14+ from every Aide.
