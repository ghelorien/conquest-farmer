# Alex 2026-10-01 05:2x: "can toxic be more bold try to get at least 2m xp per
# hour find bigger packs". In Love Canyon the Snakemen (L62/63) pack round
# their bosses: 4.5-6.5 a look per 10x10 cell by a Msgr at ~(270,530) and
# round the King's idle spot (246-249,576-579), while snakeman-south's own
# ground held 0-1.2. Aides (246-261,519-531) and Msgrs (240-270,516-540) sat
# mid-box, and its boss_chase exits (10 escapes in 2 min) came 1.5-8 minutes
# after each arrival. This box takes in those packs. Elites keep 9 tiles
# (the minimum), Kings 12, and the hunt only ends on 25 boss escapes in 2
# minutes. Danger exits still read the gate at once (cb2ae09), heavy_damage
# still leaves, and the PK check still flees. The anchor and patrol points
# keep 14+ tiles from every SnakemanKing tile logged on 2026-10-01.
hunting_boundary: [200, 466, 300, 592]
patrol_search:
  idle_seconds: 7.5
  expansion_tiles: 4
  maximum_expansions: 1
  sweep_spacing_tiles: 20
