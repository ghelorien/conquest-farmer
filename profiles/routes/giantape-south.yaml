notes: >-
  Drafted 2026-09-29 for Suicide at L52, where Macaques fell to ~291k xp/h.
  Unsurveyed: the first hunt is a supervised measurement of GiantApe damage
  per hit (abort at 50% HP or any hit over 15% of max HP). Toxic (L47) lost
  ~300 HP/s walking through the plain's north part and died at (602,278).
  Measured 2026-09-29 13:55-13:56 (Suicide L52, HornBow, IronArrow, 825 HP):
  GiantApes have ~2,700 HP and lost ~90 per Scatter hit (~30 hits each); one
  closed to 2 tiles and hit for 185 (22% of max HP). ape_guard moved the hold
  back to macaque after only 14 s of fighting, too short to judge.
  Second run 2026-09-29 15:57:00-15:58:31 (Suicide L52, IronArrow): ~85 per
  Scatter hit on the target, no damage for the first 84 s, 2 kills and ~1.4M
  xp/h from damage XP (Macaque at L52: 535k xp/h, 1,211 xp/kill at a level
  gap of 5). It left for town at 1 potion. The restock's first travel picked
  the Warehouseman cell sealed in his building (578, 538; open_warehouse now
  takes the nearest reachable one), the route restart stood still among four
  GiantApes (178-345 per hit) and Suicide died at (593, 308).
